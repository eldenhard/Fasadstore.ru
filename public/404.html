<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Страница не найдена — Алюминиевые Системы</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #082c43; color: #d7e8f7; font: 18px/1.6 Arial, sans-serif; }
    main { max-width: 640px; text-align: center; }
    .code { margin: 0; font-size: clamp(72px, 18vw, 120px); font-weight: 700; line-height: 1; }
    h1 { font-size: clamp(24px, 5vw, 36px); line-height: 1.2; }
    nav { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; margin-top: 32px; }
    a { display: inline-block; padding: 12px 24px; border-radius: 8px; background: #7a4e76; color: white; text-decoration: none; }
    a:hover { background: #633e60; }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Страница не найдена</h1>
    <p>Возможно, адрес изменился или в ссылке есть опечатка. Перейдите на главную страницу или свяжитесь с нами — поможем найти нужную информацию.</p>
    <nav aria-label="Куда перейти">
      <a href="/">На главную</a>
      <a href="/contacts/">Контакты</a>
    </nav>
  </main>
</body>
</html>
